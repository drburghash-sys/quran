name: Build Independent Quran Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'AmiriQuran.ttf'
      - 'icon-*.png'
      - 'android/**'
      - '.github/workflows/build-quran-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lah "$ANDROID_HOME/platforms" || true
          ls -lah "$ANDROID_HOME/build-tools" || true
          ls -lah "$ANDROID_HOME/cmdline-tools" || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle offline Quran HTML and launcher artwork
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable
          cp index.html manifest.webmanifest AmiriQuran.ttf icon-192.png icon-512.png android/app/src/main/assets/
          cp icon-512.png android/app/src/main/res/drawable/quran_icon.png
      - name: Build debug-signed installable APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Stage package
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Quran_Independent_V15.apk
          ls -lh Quran_Independent_V15.apk
      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Quran_Independent_V15_APK
          path: Quran_Independent_V15.apk
          retention-days: 90
      - name: Publish direct download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v15.0-independent >/dev/null 2>&1; then
            gh release upload v15.0-independent Quran_Independent_V15.apk --clobber
          else
            gh release create v15.0-independent Quran_Independent_V15.apk \
              --title "القرآن المتكامل الجديد - نسخة مستقلة V15" \
              --notes "نسخة مستقلة (com.drburghash.quran.independent) تثبت بجانب القرآن القديم دون إزالة بياناته. لاستعادة سجل الحفظ افتح الخطة ثم البيانات ثم استعادة نسخة الخطة. المتشابهات والتظليل تحتاج نقل نسخها المستقلة قبل حذف أي تطبيق."
          fi
