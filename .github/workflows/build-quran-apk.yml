name: Build Quran Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'AmiriQuran.ttf'
      - 'icon-*.png'
      - 'android/**'
      - '.github/workflows/build-quran-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle offline Quran HTML and launcher artwork
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable
          cp index.html manifest.webmanifest AmiriQuran.ttf icon-192.png icon-512.png android/app/src/main/assets/
          cp icon-512.png android/app/src/main/res/drawable/quran_icon.png
      - name: Build debug-signed installable APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Stage package
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Quran_V14.apk
          ls -lh Quran_V14.apk
      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Quran_V14_APK
          path: Quran_V14.apk
          retention-days: 90
      - name: Publish direct download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v14.0 >/dev/null 2>&1; then
            gh release upload v14.0 Quran_V14.apk --clobber
          else
            gh release create v14.0 Quran_V14.apk \
              --title "القرآن المتكامل V14 APK" \
              --notes "تحديد مدة أو تاريخ إنهاء الخطة، اختيار الصفحات من قوائم منسدلة، حفظ موضع التوقف، ودعم النسخ الاحتياطي. نسخة Android مستقلة."
          fi
