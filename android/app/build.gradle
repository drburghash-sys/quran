plugins {
    id 'com.android.application'
}
android {
    namespace 'com.drburghash.quran'
    compileSdk 35
    defaultConfig {
        applicationId 'com.drburghash.quran.independent'
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName '15.0-independent'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
